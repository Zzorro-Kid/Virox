name: virox
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  http: ^1.5.0
  shared_preferences: ^2.5.3
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  dartz: ^0.10.1
  flutter_bloc: ^8.1.6
  flutter_svg: ^2.2.3
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7


flutter:

  uses-material-design: true

  assets:
     - assets/data/posts.json
     - assets/data/version.json
     - assets/icons/

  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SFProText-Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProText-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProText-SemiBold.ttf 
          weight: 600
        - asset: assets/fonts/SFProText-Bold.ttf 
          weight: 700
    
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700
  

